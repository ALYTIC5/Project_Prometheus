name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy prometheus/core/
      # Exit code 5 is pytest's EXIT_NOTESTSCOLLECTED. There are no non-law
      # tests outside tests/laws/ yet, so 5 is the correct state right now
      # and must not fail the job. Any other non-zero code still does.
      - name: Run non-law tests
        run: |
          set +e
          pytest tests/ -v --ignore=tests/laws
          code=$?
          if [ "$code" -ne 0 ] && [ "$code" -ne 5 ]; then exit "$code"; fi

  laws:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: prometheus
          POSTGRES_PASSWORD: prometheus
          POSTGRES_DB: prometheus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://prometheus:prometheus@localhost:5432/prometheus_test
      TEST_DATABASE_URL: postgresql+asyncpg://prometheus:prometheus@localhost:5432/prometheus_test
      MAX_POSITION_PCT: "11"
      MAX_GROSS_EXPOSURE_PCT: "22"
      MAX_LEVERAGE: "3"
      MAX_DAILY_LOSS_PCT: "4"
      MAX_DRAWDOWN_PCT: "15"
      KILL_SWITCH: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: alembic upgrade head
      - name: Run law tests
        run: pytest tests/laws/ -v || (echo "::error::LAW VIOLATION — a tests/laws/ check failed. This gate does not get weakened, skipped, or deleted; fix the code." && exit 1)

# Railway deployment is configured separately, outside CI, once the
# project owner has a Railway project + credentials set up (PROMPTS.md
# PROMPT 1 Part D). A CI-triggered deploy step will be added here once
# that exists. Do not add a Docker-Hub-based deploy job in the meantime
# -- Docker Hub is not this project's deployment target.
