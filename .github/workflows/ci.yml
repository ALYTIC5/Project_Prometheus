name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy prometheus/core/ prometheus/validation/
      # `db`-marked tests need the Postgres service the db-tests job below
      # provides; this job has none, so they're excluded rather than left
      # to fail. Non-law, non-db tests are real and collected now, so a
      # plain nonzero exit fails the job -- no EXIT_NOTESTSCOLLECTED
      # allowance left to carry forward.
      - name: Run non-law, non-db tests
        run: pytest tests/ -v --ignore=tests/laws -m "not db"

  db-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: prometheus
          POSTGRES_PASSWORD: prometheus
          POSTGRES_DB: prometheus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://prometheus:prometheus@localhost:5432/prometheus_test
      TEST_DATABASE_URL: postgresql+asyncpg://prometheus:prometheus@localhost:5432/prometheus_test
      # migration 0010's restricted holdout role (prometheus/validation/
      # holdout.py). Same postgres service/user as above -- the CI
      # postgres image's bootstrap user is a real superuser, same as
      # Railway's, so CREATE ROLE works identically here.
      HOLDOUT_DB_ROLE: prometheus_holdout
      HOLDOUT_DB_PASSWORD: ci-holdout-password
      HOLDOUT_DATABASE_URL: postgresql+asyncpg://prometheus_holdout:ci-holdout-password@localhost:5432/prometheus_test
      # Law 9 (tests/laws/test_evaluator_isolation.py): migration 0024's
      # research role, proven unable to touch judging state.
      RESEARCH_DB_ROLE: prometheus_research
      RESEARCH_DB_PASSWORD: ci-research-password
      RESEARCH_DATABASE_URL: postgresql+asyncpg://prometheus_research:ci-research-password@localhost:5432/prometheus_test
      MAX_POSITION_PCT: "11"
      MAX_GROSS_EXPOSURE_PCT: "22"
      MAX_LEVERAGE: "3"
      MAX_DAILY_LOSS_PCT: "4"
      MAX_DRAWDOWN_PCT: "15"
      KILL_SWITCH: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: alembic upgrade head
      # A marker, not -k: a new db-marked test added later is picked up
      # automatically instead of silently skipping because someone forgot
      # to update a -k expression here.
      - name: Run db-marked tests
        run: pytest tests/ -v -m db

  laws:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: prometheus
          POSTGRES_PASSWORD: prometheus
          POSTGRES_DB: prometheus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://prometheus:prometheus@localhost:5432/prometheus_test
      TEST_DATABASE_URL: postgresql+asyncpg://prometheus:prometheus@localhost:5432/prometheus_test
      # Law 3 (tests/laws/test_holdout_sacred.py) needs a real, separate
      # login role to prove it's genuinely restricted -- see migration
      # 0010's docstring.
      HOLDOUT_DB_ROLE: prometheus_holdout
      HOLDOUT_DB_PASSWORD: ci-holdout-password
      HOLDOUT_DATABASE_URL: postgresql+asyncpg://prometheus_holdout:ci-holdout-password@localhost:5432/prometheus_test
      # Law 9 (tests/laws/test_evaluator_isolation.py): migration 0024's
      # research role, proven unable to touch judging state.
      RESEARCH_DB_ROLE: prometheus_research
      RESEARCH_DB_PASSWORD: ci-research-password
      RESEARCH_DATABASE_URL: postgresql+asyncpg://prometheus_research:ci-research-password@localhost:5432/prometheus_test
      MAX_POSITION_PCT: "11"
      MAX_GROSS_EXPOSURE_PCT: "22"
      MAX_LEVERAGE: "3"
      MAX_DAILY_LOSS_PCT: "4"
      MAX_DRAWDOWN_PCT: "15"
      KILL_SWITCH: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: alembic upgrade head
      - name: Run law tests
        run: pytest tests/laws/ -v || (echo "::error::LAW VIOLATION — a tests/laws/ check failed. This gate does not get weakened, skipped, or deleted; fix the code." && exit 1)

# Railway deployment is configured separately, outside CI, once the
# project owner has a Railway project + credentials set up (PROMPTS.md
# PROMPT 1 Part D). A CI-triggered deploy step will be added here once
# that exists. Do not add a Docker-Hub-based deploy job in the meantime
# -- Docker Hub is not this project's deployment target.
