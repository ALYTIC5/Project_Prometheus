[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "prometheus"
version = "0.1.0"
description = "Quantitative research and paper-trading laboratory"
requires-python = ">=3.11"
dependencies = [
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "sqlalchemy==2.0.35",
    "alembic==1.13.3",
    "asyncpg==0.31.0",
    "psycopg[binary]==3.2.3",
    "pyyaml==6.0.2",
]

[project.optional-dependencies]
dev = [
    "ruff==0.6.9",
    "mypy==1.11.2",
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pre-commit==3.8.0",
    "types-PyYAML==6.0.12.20240917",
]

[tool.hatch.build.targets.wheel]
packages = [
    "core", "data", "strategy", "backtest", "validation",
    "experiments", "research", "paper", "world", "api",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["core", "data", "strategy", "backtest", "validation",
       "experiments", "research", "paper", "world", "api", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["core.*", "validation.*"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "laws: immutable law tests, see tests/laws/",
]
