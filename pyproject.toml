[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "prometheus"
version = "0.1.0"
description = "Quantitative research and paper-trading laboratory"
requires-python = ">=3.11"
dependencies = [
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "sqlalchemy==2.0.35",
    "alembic==1.13.3",
    "asyncpg==0.31.0",
    "psycopg[binary]==3.2.3",
    "pyyaml==6.0.2",
    "polars==1.44.1",
    "ccxt==4.5.77",
]

[project.optional-dependencies]
dev = [
    "ruff==0.6.9",
    "mypy==1.11.2",
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pre-commit==3.8.0",
    "types-PyYAML==6.0.12.20240917",
]

[tool.hatch.build.targets.wheel]
packages = ["prometheus"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
plugins = ["pydantic.mypy"]
# numpy==2.5.2 (pulled in by polars==1.44.1) ships stubs using PEP 695
# `type X = ...` aliases, which mypy only parses under python_version >= 3.12.
# mypy's python_version is not overridable per-module, so this must be the
# global setting; requires-python (>=3.11) is unaffected.
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["prometheus.core.*", "prometheus.validation.*"]
strict = true

# ccxt ships no py.typed marker / stubs; prometheus.data.ingestion imports
# it directly (real exchange client). Scoped to just this module rather
# than a blanket ignore_missing_imports.
[[tool.mypy.overrides]]
module = ["ccxt"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "laws: immutable law tests, see tests/laws/",
]
